# ARISE PoC with coraine - ROS 2 turtles, history in TimescaleDB, Grafana dashboards, c3 demo descriptor.
# See: How-to Guides > Run the ARISE PoC with coraine
services:

  timescale:
    image: timescale/timescaledb-ha:pg17-ts2.18
    environment:
      - POSTGRES_USER=coraine
      - POSTGRES_PASSWORD=coraine
    volumes:
      - timescale_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coraine"]
      interval: 5s
      retries: 30

  coraine:
    image: quay.io/seamware/coraine:0.7.0
    ipc: host
    ports:
      - "1026:1026"
    depends_on:
      timescale:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - CORAINE_TROEPWD=coraine
    command:
      - --database
      - corDB
      - --dbDir
      - /data
      - --troe
      - timescale
      - --troeHost
      - timescale
      - --troeUser
      - coraine
      - --troeName
      - arise
      - --apiPlugins
      - admin
      - --transports
      - ws
      - --bridges
      - dds
      - --bridgeConfig
      - /opt/seamware/etc/dds.json
    volumes:
      - ./dds.json:/opt/seamware/etc/dds.json:ro
      - coraine_data:/data
      - dds_types:/opt/seamware/etc/dds-types

  # Creates the static part of the model once: the robot cell and the arena.
  seed:
    image: curlimages/curl:8.10.1
    depends_on:
      coraine:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        curl -sS -X POST http://coraine:1026/ngsi-ld/v1/entityOperations/upsert
        -H "Content-Type: application/json" --data-binary @/seed/arena.json &&
        curl -sS -X POST http://coraine:1026/ngsi-ld/v1/entityOperations/upsert
        -H "Content-Type: application/json" -H "NGSILD-Tenant: arise" --data-binary @/seed/cell-opcua.json

  # --- OPC UA part (interim: FIWARE IoT Agent; to be replaced by coraine's OPC UA bridge) ---

  # An OPC UA server to test with: Microsoft's OPC PLC simulator (MIT). Its nodes change on their own.
  opcplc:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.10
    command: ["--pn=50000", "--autoaccept", "--unsecuretransport", "--sn=0", "--fn=0"]

  # FIWARE IoT Agent for OPC UA: reads the OPC UA nodes and writes them to coraine over NGSI-LD.
  iot-agent:
    image: iotagent4fiware/iotagent-opcua:2.3.2
    depends_on:
      coraine:
        condition: service_healthy
      opcplc:
        condition: service_started
    restart: unless-stopped
    environment:
      - CONFIGURATION_TYPE=dynamic
      - IOTA_CB_HOST=coraine
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSIVERSION=ld
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=memory
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULTRESOURCE=/iot/opcua
      - IOTA_TIMESTAMP=true
      - IOTA_EXPLICITATTRS=true
      - IOTA_AUTOPROVISION=false
      - IOTA_LOGLEVEL=INFO
      - IOTA_OPCUA_ENDPOINT=opc.tcp://opcplc:50000
      - IOTA_OPCUA_SECURITY_MODE=None
      - IOTA_OPCUA_SECURITY_POLICY=None
      - IOTA_OPCUA_UNIQUE_SUBSCRIPTION=false
      - IOTA_OPCUA_SUBSCRIPTION_REQ_PUBLISHING_INTERVAL=1000
      - IOTA_OPCUA_MT_POLLING=false

  # Provisions the press on the IoT Agent once: which OPC UA node becomes which attribute.
  iot-provision:
    image: curlimages/curl:8.10.1
    depends_on:
      - iot-agent
    restart: "no"
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        until curl -sf http://iot-agent:4041/iot/about > /dev/null; do sleep 2; done;
        curl -sS -X POST http://iot-agent:4041/iot/devices
        -H "fiware-service: arise" -H "fiware-servicepath: /"
        -H "Content-Type: application/json"
        --data-binary @/seed/press-device.json

  # Serves the descriptor that makes this PoC a named demo in c3.
  c3-descriptor:
    image: busybox:1.36
    ports:
      - "7996:7996"
    command: ["httpd", "-f", "-p", "7996", "-h", "/www"]
    volumes:
      - ./c3:/www:ro

  ros2:
    build: ./ros2
    image: arise-poc-turtlesim:jazzy
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    depends_on:
      - coraine
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=yesoreyeram-infinity-datasource@4.1.5
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

volumes:
  timescale_data:
  coraine_data:
  dds_types:
  grafana_data:
